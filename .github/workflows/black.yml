name: Code Quality & Auto-Fix (Black, Isort, Ruff)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Verify uv
        run: uv --version

      - name: Generate uv.lock
        run: |
          rm -f uv.lock
          uv lock --prerelease=allow

      - name: Sync dependencies
        run: uv sync

      - name: Install formatting tools
        run: uv pip install black isort ruff pip-audit

      - name: Format with Black and Isort
        run: |
          uv run black .
          uv run isort .

      - name: Ruff auto-fix
        run: |
          uv run ruff check . --fix --unsafe-fixes --exit-zero

      - name: Dependency audit
        run: |
          uv run pip-audit || true

      - name: Commit and Push formatting fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          uv lock --prerelease=allow || true
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes found! Applying auto-fixes directly to main branch..."
            git add -A
            git commit -m "chore: auto-format code with black, isort and ruff"
            git push origin main
          else
            echo "No formatting changes detected. Code is completely clean!"
          fi
