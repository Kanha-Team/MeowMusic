start_2 : "ʜєʏ, {0} ✨\nɪ'ϻ {1} — ɪ ᴄᴧη ᴘʟᴧʏ ϻυsɪᴄ ɪη ᴠσɪᴄє ᴄʜᴧᴛs, ɢєηєꝛᴧᴛє ɪϻᴧɢєs, ᴛꝛᴧηsʟᴧᴛє ʟᴧηɢυᴧɢєs ᴧηᴅ ϻᴧηᴧɢє ɢꝛσυᴘs sϻσσᴛʜʟʏ.\n\n๏ ϻσꝛє: ᴛᴧᴘ ʜєʟᴘ ғσꝛ ᴄσϻϻᴧηᴅs<a href='{2}'>.</a>"
start_3 : "ʜєʏ {0},\nᴛʜɪs ɪs {1}\n\nᴛʜᴧηᴋs ғσꝛ ᴧᴅᴅɪηɢ ϻє ɪη {2}, {3} ᴄᴧη ησᴡ ᴘʟᴧʏ sσηɢs ɪη ᴛʜɪs ᴄʜᴧᴛ<a href='{4}'>.</a>"
